# XcodeGen specification for the Picshop iOS app.
#   brew install xcodegen && xcodegen generate && open Picshop.xcodeproj
# (or simply run Scripts/bootstrap.sh)
name: PicShop
options:
  bundleIdPrefix: com.picshopio
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
  groupSortPosition: top

settings:
  base:
    # The app target uses Swift 5 language mode; PicshopCore/PicshopIntent opt into Swift 6 in Package.swift.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  PicshopKit:
    path: .
  # The local brain (Qwen3.5 through MLX, App/LocalBrain). mlx-swift-lm is pinned to a
  # main revision: the Qwen3.5 fixes it needs (#399, #409, #515, #611) are in no tag yet.
  # Move to the next 3.x tag that contains them. Needs the Metal Toolchain to build.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    revision: ee673d6a71d76e67b532dc7eaf91d92edc3bb8bb
  # The tokenizer the MLX loader uses (App/LocalBrain).
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    exactVersion: 1.3.4
  # Stable Diffusion "Generative Fill" is added by project-pro.yml:
  # `xcodegen generate --spec project-pro.yml`.

targets:
  PicShop:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
          - "Models/**"
      # Core ML packages produced by Scripts/convert_models.py (compiled into the bundle by Xcode).
      # Only the packages present at generation time are referenced, so a build without them still works.
      - path: App/Models
        optional: true
        excludes:
          - ".gitkeep"
    dependencies:
      - package: PicshopKit
        product: PicshopUI
      - package: PicshopKit
        product: PicshopCore
      - package: PicshopKit
        product: PicshopIntent
      - package: PicshopKit
        product: PicshopImaging
      - package: PicshopKit
        product: PicshopVideo
      - package: PicshopKit
        product: PicshopSpeech
      - package: PicshopKit
        product: PicshopPDF
      - package: MLXSwiftLM
        product: MLXVLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    configFiles:
      Debug: App/BuildStamp.xcconfig
      Release: App/BuildStamp.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picshopio.picshop
        PRODUCT_NAME: PicShop
        # Hand-maintained Info.plist and entitlements (not generated by XcodeGen).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Picshop.entitlements
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-ObjC"
    preBuildScripts:
      - name: Verify Core ML models
        script: |
          "${SRCROOT}/Scripts/verify-models.sh" || true
        basedOnDependencyAnalysis: false

schemes:
  PicShop:
    build:
      targets:
        PicShop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PicshopKit/PicshopCoreTests
        - package: PicshopKit/PicshopIntentTests
    profile:
      config: Release
    archive:
      config: Release
