# XcodeGen specification for the Picshop iOS app.
#   brew install xcodegen && xcodegen generate && open Picshop.xcodeproj
# (or simply run Scripts/bootstrap.sh)
name: PicShop
options:
  bundleIdPrefix: com.picshop
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  defaultConfig: Release
  groupSortPosition: top

settings:
  base:
    # The app target uses Swift 5 language mode; PicshopCore/PicshopIntent opt into Swift 6 in Package.swift.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      SWIFT_OPTIMIZATION_LEVEL: -O
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  PicshopKit:
    path: .
  # "Pro Brain": optional on-device MLX LLM (Qwen3-4B, 4-bit). Remove this
  # package (and the App/ProBrain sources) to ship with Apple Intelligence only.
  MLXSwiftExamples:
    url: https://github.com/ml-explore/mlx-swift-examples
    from: "2.25.0"
  # Generative Fill: Apple's Core ML Stable Diffusion runtime. Optional like MLX.
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.0"

targets:
  PicShop:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/*.md"
    dependencies:
      - package: PicshopKit
        product: PicshopUI
      - package: PicshopKit
        product: PicshopCore
      - package: PicshopKit
        product: PicshopIntent
      - package: PicshopKit
        product: PicshopImaging
      - package: PicshopKit
        product: PicshopVideo
      - package: PicshopKit
        product: PicshopSpeech
      - package: PicshopKit
        product: PicshopPDF
      - package: StableDiffusion
        product: StableDiffusion
      - package: MLXSwiftExamples
        product: MLXLLM
      - package: MLXSwiftExamples
        product: MLXLMCommon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picshop.app
        PRODUCT_NAME: PicShop
        # Hand-maintained Info.plist and entitlements (not generated by XcodeGen).
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Picshop.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS: "-ObjC"
    preBuildScripts:
      - name: Verify Core ML models
        script: |
          "${SRCROOT}/Scripts/verify-models.sh" || true
        basedOnDependencyAnalysis: false

schemes:
  PicShop:
    build:
      targets:
        PicShop: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: PicshopKit/PicshopCoreTests
        - package: PicshopKit/PicshopIntentTests
    profile:
      config: Release
    archive:
      config: Release
