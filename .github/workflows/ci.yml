name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core & Intent tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel

  syntax:
    name: Apple-only sources syntax gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-swift
      - run: python3 Scripts/swift-syntax-check.py Sources Tests App

  package-macos:
    name: Package tests (macOS, Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: swift test
        run: |
          set -o pipefail
          swift test --filter 'PicshopCoreTests|PicshopIntentTests|PicshopImagingTests' 2>&1 | tee swift-test.log
      - name: Errors
        if: failure()
        run: grep -E "error:" swift-test.log | sort -u || true

  ios-build:
    name: iOS app build (Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          xcrun simctl list runtimes || true
      - name: Install iOS platform when missing
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            sudo xcodebuild -downloadPlatform iOS
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (iOS Simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild build -project PicShop.xcodeproj -scheme PicShop \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation 2>&1 | tee build-sim.log | grep -E "error:|warning: (unused|var|immutable)|BUILD|Compiling|Ld " || true
          grep -q "BUILD SUCCEEDED" build-sim.log
      - name: Build (iOS device, Release)
        run: |
          set -o pipefail
          xcodebuild build -project PicShop.xcodeproj -scheme PicShop \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation 2>&1 | tee build-device.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: Errors
        if: failure()
        run: |
          echo "=== errors ==="; grep -E "error:" build-sim.log build-device.log 2>/dev/null | sort -u || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore
