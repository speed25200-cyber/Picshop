name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the run in progress: the macOS
# runners are the bottleneck, and only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core & Intent tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --parallel

  syntax:
    name: Apple-only sources syntax gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tree-sitter tree-sitter-swift
      - run: python3 Scripts/swift-syntax-check.py Sources Tests App
      # Everything stays on the iPhone: no cloud endpoint, key or copy may come back.
      - name: No-cloud check
        run: bash Scripts/check-no-cloud.sh
      # The string catalog matches the sources and every key has its French.
      - name: Strings check
        run: python3 Scripts/generate_strings.py --check
      # Literal radii, opacities and font sizes may only shrink: failing once the baseline
      # (Scripts/design-token-baseline.json) has landed, a report before.
      - name: Design-token lint
        run: |
          if [ -f Scripts/design-token-baseline.json ]; then python3 Scripts/lint-design-tokens.py
          elif [ -f Scripts/lint-design-tokens.py ]; then python3 Scripts/lint-design-tokens.py --report || true
          else echo "lint-design-tokens.py not landed yet"; fi
      # No findString(, PDFComposer.compose( or createCGImage( on the main actor (allowlist in Scripts/).
      - name: Main-thread lint
        run: bash Scripts/lint-main-thread.sh

  package-macos:
    name: Package tests (macOS, Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Build every module (collect all errors)
        run: |
          set -o pipefail
          status=0
          for target in PicshopCore PicshopIntent PicshopImaging PicshopVideo PicshopSpeech PicshopPDF PicshopUI; do
            echo "::group::swift build --target $target"
            if ! swift build --target "$target" 2>&1 | tee "build-$target.log"; then status=1; fi
            echo "::endgroup::"
          done
          echo "=== errors ==="; grep -hE "error:" build-*.log | sort -u || true
          exit $status
      # W2: the pinned SAM 2.1 tiny and Depth Anything V2 Small packages for SAMPipelineTests, DepthPipelineTests and
      # PinnedInstallTests (compiled by the tests, run on the CPU: the VM has no Neural Engine). Cached on the pins.
      # When the fetch fails the variable stays unset and those tests skip; when it is set and a package is
      # missing they fail, so a misconfiguration cannot pass silently.
      - name: Cache mask models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/picshop-mask-models
          key: picshop-mask-models-${{ hashFiles('Sources/PicshopCore/Models/MaskModelCatalog.swift') }}
      - name: Fetch the pinned mask models
        id: mask-models
        continue-on-error: true
        run: bash Scripts/fetch-mask-models.sh "$HOME/Library/Caches/picshop-mask-models"
      - name: Point the tests at the mask models
        if: steps.mask-models.outcome == 'success'
        run: echo "PICSHOP_MASK_MODELS=$HOME/Library/Caches/picshop-mask-models" >> "$GITHUB_ENV"
      - name: swift test
        run: |
          set -o pipefail
          swift test --filter 'PicshopCoreTests|PicshopIntentTests|PicshopImagingTests|PicshopPDFTests|PicshopVideoTests' 2>&1 | tee swift-test.log
      - name: Errors
        if: failure()
        run: grep -hE "error:" swift-test.log build-*.log | sort -u || true

  ios-build:
    name: iOS app build (Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios || true
          xcrun simctl list runtimes || true
      - name: Install iOS platform when missing
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 26"; then
            sudo xcodebuild -downloadPlatform iOS
          fi
      - name: Cache converted Core ML models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/picshop-models
          key: picshop-models-${{ hashFiles('Scripts/convert_models.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert neural models (LaMa, Real-ESRGAN)
        run: |
          if ! ls -d ~/Library/Caches/picshop-models/packages/*/*.mlpackage >/dev/null 2>&1; then
            python3 -m pip install --quiet --upgrade pip
            python3 -m pip install --quiet "torch==2.5.1" "coremltools==8.2" "numpy<2.3"
          fi
          python3 Scripts/convert_models.py all --out App/Models || true
          ls -la App/Models || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Metal Toolchain and package trust
        run: |
          # mlx-swift (the local brain) compiles Metal kernels: the component must be installed.
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version | head -1 || echo "Metal Toolchain missing"
          # mlx-swift ships a build-tool plugin; trust package plugins and macros on this CI machine.
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/picshop-spm
          key: spm-ios-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-ios-${{ runner.os }}-
      - name: Generate project
        run: sh Scripts/build-stamp.sh && xcodegen generate
      - name: Build (iOS Simulator, Debug)
        run: |
          set -o pipefail
          xcodebuild build -project PicShop.xcodeproj -scheme PicShop \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -clonedSourcePackagesDirPath ~/picshop-spm -derivedDataPath ~/picshop-dd \
            CODE_SIGNING_ALLOWED=NO -skipPackagePluginValidation -skipMacroValidation -IDEBuildingContinueBuildingAfterErrors=YES 2>&1 | tee build-sim.log | grep -E "error:|warning: (unused|var|immutable)|BUILD|Compiling|Ld " || true
          grep -q "BUILD SUCCEEDED" build-sim.log
      # W2: the six DEBUG launch scenarios (App/PicshopApp.swift, -PicshopScenario <name>) on three screen sizes, at
      # the default text size and at Accessibility XXXL, for the visual review the Linux lanes cannot do. Each launch
      # waits for the app's « scenario ready » marker (Documents/scenario-ready-<name>), then takes the screenshot.
      # A scenario that never gets ready still gets its screenshot and a warning; the job does not fail on it.
      - name: Scenario screenshots (iOS Simulator)
        continue-on-error: true
        run: |
          APP=~/picshop-dd/Build/Products/Debug-iphonesimulator/PicShop.app
          BUNDLE=com.picshopio.picshop
          OUT="$PWD/scenario-screenshots"
          mkdir -p "$OUT"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; r.sort(key=lambda x: [int(p) for p in x["version"].split(".")]); print(r[-1]["identifier"] if r else "")')
          echo "runtime: $RUNTIME"
          [ -n "$RUNTIME" ] || { echo "::warning::no iOS simulator runtime"; exit 0; }
          for DEVICE in "iPhone SE (3rd generation)" "iPhone 16" "iPhone 16 Pro Max"; do
            TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; n=sys.argv[1]; t=[d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"]==n]; print(t[0] if t else "")' "$DEVICE")
            if [ -z "$TYPE" ]; then echo "::warning::no simulator type '$DEVICE'"; continue; fi
            UDID=$(xcrun simctl create "picshop-$TYPE" "$TYPE" "$RUNTIME")
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$UDID" "$APP"
            SLUG=$(echo "$DEVICE" | tr -cd '[:alnum:]')
            for SIZE in default AccessibilityXXXL; do
              for SCENARIO in masks3 maskHandles selectOutline colorRange selectAndMask graphiteOn; do
                DATA=$(xcrun simctl get_app_container "$UDID" "$BUNDLE" data)
                rm -f "$DATA/Documents/scenario-ready-$SCENARIO"
                xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
                if [ "$SIZE" = default ]; then
                  xcrun simctl launch "$UDID" "$BUNDLE" -PicshopScenario "$SCENARIO"
                else
                  xcrun simctl launch "$UDID" "$BUNDLE" -PicshopScenario "$SCENARIO" -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityXXXL
                fi
                ready=no
                for _ in $(seq 1 90); do
                  if [ -f "$DATA/Documents/scenario-ready-$SCENARIO" ]; then ready=yes; break; fi
                  sleep 1
                done
                [ "$ready" = yes ] || echo "::warning::scenario $SCENARIO on $DEVICE ($SIZE) never reported ready"
                xcrun simctl io "$UDID" screenshot "$OUT/$SLUG-$SIZE-$SCENARIO.png"
              done
            done
            xcrun simctl terminate "$UDID" "$BUNDLE" >/dev/null 2>&1 || true
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          done
          ls -la "$OUT"
      - name: Upload scenario screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-screenshots
          path: scenario-screenshots/*.png
          if-no-files-found: warn
      - name: Build (iOS device, Release)
        run: |
          set -o pipefail
          xcodebuild build -project PicShop.xcodeproj -scheme PicShop \
            -destination 'generic/platform=iOS' -configuration Release \
            -clonedSourcePackagesDirPath ~/picshop-spm -derivedDataPath ~/picshop-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation -IDEBuildingContinueBuildingAfterErrors=YES 2>&1 | tee build-device.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-device.log
      - name: App size (report only)
        run: |
          APP=~/picshop-dd/Build/Products/Release-iphoneos/PicShop.app
          du -sh "$APP" || true
          find "$APP" -name '*.metallib' -exec du -h {} + || true
      - name: Errors
        if: failure()
        run: |
          echo "=== errors ==="; grep -E "error:" build-sim.log build-device.log 2>/dev/null | sort -u || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: "*.log"
          if-no-files-found: ignore

  pro-build:
    name: Pro app build (local brain + Stable Diffusion, Xcode 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Cache converted Core ML models
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/picshop-models
          key: picshop-models-${{ hashFiles('Scripts/convert_models.py') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Convert neural models (LaMa, Real-ESRGAN)
        run: |
          if ! ls -d ~/Library/Caches/picshop-models/packages/*/*.mlpackage >/dev/null 2>&1; then
            python3 -m pip install --quiet --upgrade pip
            python3 -m pip install --quiet "torch==2.5.1" "coremltools==8.2" "numpy<2.3"
          fi
          python3 Scripts/convert_models.py all --out App/Models || true
          ls -la App/Models || true
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Metal Toolchain and package trust
        run: |
          # mlx-swift (the local brain) compiles Metal kernels: the component must be installed.
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version | head -1 || echo "Metal Toolchain missing"
          # mlx-swift ships a build-tool plugin; trust package plugins and macros on this CI machine.
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/picshop-spm
          key: spm-pro-${{ runner.os }}-${{ hashFiles('project.yml', 'project-pro.yml') }}
          restore-keys: spm-pro-${{ runner.os }}-
      - name: Generate project (pro)
        run: sh Scripts/build-stamp.sh && xcodegen generate --spec project-pro.yml
      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies -project PicShop.xcodeproj -scheme PicShop \
            -clonedSourcePackagesDirPath ~/picshop-spm -skipPackagePluginValidation -skipMacroValidation
      - name: Build (iOS device, Release)
        run: |
          set -o pipefail
          xcodebuild build -project PicShop.xcodeproj -scheme PicShop \
            -destination 'generic/platform=iOS' -configuration Release \
            -clonedSourcePackagesDirPath ~/picshop-spm -derivedDataPath ~/picshop-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -skipPackagePluginValidation -skipMacroValidation -IDEBuildingContinueBuildingAfterErrors=YES 2>&1 | tee build-pro.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-pro.log
      - name: App size (report only)
        run: |
          APP=~/picshop-dd/Build/Products/Release-iphoneos/PicShop.app
          du -sh "$APP" || true
          find "$APP" -name '*.metallib' -exec du -h {} + || true
      - name: Errors
        if: failure()
        run: grep -E "error:" build-pro.log | sort -u || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-pro-logs
          path: "*.log"
          if-no-files-found: ignore
