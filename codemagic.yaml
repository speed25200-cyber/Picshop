# Codemagic CI/CD for PicShop.
#
# Workflows
#   picshop-testflight  — signs with your App Store Connect API key and uploads to TestFlight.
#                          Requirements in Codemagic (Teams → Integrations → Developer Portal):
#                            • an App Store Connect integration named "app_store_connect"
#                              (API key with the App Manager role)
#                          Optional Codemagic environment variables:
#                            • CERTIFICATE_PRIVATE_KEY — RSA key backing the distribution certificate
#                              (a throw-away key is generated per build when absent)
#                            • APP_STORE_APPLE_ID — numeric App Store app id for build-number lookup
#                          The bundle ID, certificate and provisioning profile are created in the
#                          developer portal automatically when missing. An app record with bundle ID
#                          com.picshop.app must exist in App Store Connect for the TestFlight upload.
#   picshop-unsigned    — build + tests + unsigned archive, no Apple credentials needed.
definitions:
  env: &env
    xcode: latest
    vars:
      XCODE_PROJECT: "PicShop.xcodeproj"
      XCODE_SCHEME: "PicShop"
      BUNDLE_ID: "com.picshop.app"
      # Optional: add APP_STORE_APPLE_ID (numeric App Store app id) as a Codemagic environment
      # variable to derive the build number from the latest TestFlight build.
  cache: &cache
    cache_paths:
      - $HOME/Library/Caches/org.swift.swiftpm
      - $HOME/Library/Developer/Xcode/DerivedData
  scripts:
    - &toolchain
      name: Toolchain
      script: |
        set -e
        xcodebuild -version
        swift --version
        brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
    - &generate
      name: Generate Xcode project
      script: |
        set -e
        xcodegen generate
        ls -d *.xcodeproj
    - &tests
      name: Package tests
      script: |
        set -e
        # Only the platform-independent modules are tested here; the Apple-only modules are
        # compiled for real by the xcodebuild steps below.
        swift build --target PicshopCoreTests --target PicshopIntentTests
        swift test --skip-build --filter 'PicshopCoreTests|PicshopIntentTests'
    - &resolve
      name: Resolve dependencies
      script: |
        set -e
        xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
    - &simulator
      name: Build (simulator)
      script: |
        set -e
        xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
          -destination 'generic/platform=iOS Simulator' -configuration Debug \
          CODE_SIGNING_ALLOWED=NO -quiet

workflows:
  picshop-testflight:
    name: PicShop → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_connect
    environment: *env
    cache: *cache
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *toolchain
      - *generate
      - *tests
      - name: Signing files
        script: |
          set -e
          if [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "❌ Intégration App Store Connect introuvable."
            echo "   Codemagic → Teams → Integrations → Developer Portal → ajouter une clé API App Store Connect"
            echo "   (rôle App Manager) et la nommer « app_store_connect »."
            exit 1
          fi
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "⚠️  CERTIFICATE_PRIVATE_KEY non défini : clé éphémère générée, un nouveau certificat"
            echo "   de distribution sera créé dans le portail développeur pour ce build."
            echo "   Pour un certificat stable, ajoutez la variable CERTIFICATE_PRIVATE_KEY (clé RSA 2048,"
            echo "   openssl genrsa 2048) dans Codemagic → App settings → Environment variables."
            openssl genrsa -out "$CM_BUILD_DIR/ephemeral_cert_key.pem" 2048 2>/dev/null
            export CERTIFICATE_PRIVATE_KEY="$(cat "$CM_BUILD_DIR/ephemeral_cert_key.pem")"
          fi
          keychain initialize
          # Creates the bundle ID, the distribution certificate and the App Store profile when missing.
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build number
        script: |
          set -e
          LATEST=0
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 || true)
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$(( LATEST + 1 ))
          if [ "$NEXT" -lt "${BUILD_NUMBER:-1}" ]; then NEXT="$BUILD_NUMBER"; fi
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - *resolve
      - name: Archive & IPA
        script: |
          set -e
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Testeurs internes

  picshop-unsigned:
    name: PicShop (unsigned check)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment: *env
    cache: *cache
    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *toolchain
      - *generate
      - *tests
      - *resolve
      - *simulator
      - name: Archive (unsigned)
        script: |
          set -e
          xcodebuild archive -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/PicShop.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
          (cd build && zip -qr PicShop.xcarchive.zip PicShop.xcarchive)
    artifacts:
      - build/PicShop.xcarchive.zip
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
