# Codemagic CI/CD for PicShop.
#
# Connect the repository in Codemagic (Add application → GitHub → speed25200-cyber/Picshop),
# then start the "picshop-ios" workflow on this branch. Two modes:
#   • unsigned (default): builds and tests, uploads an .xcarchive — no Apple credentials needed.
#   • signed TestFlight: add an App Store Connect integration named "app_store_connect" and a
#     BUNDLE_ID / TEAM_ID group (see "signing" below); the workflow then archives an .ipa
#     and publishes it to TestFlight.
workflows:
  picshop-ios:
    name: PicShop iOS
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "PicShop.xcodeproj"
        XCODE_SCHEME: "PicShop"
        BUNDLE_ID: "com.picshop.app"
      # Uncomment to sign and publish to TestFlight (requires the integration + group in Codemagic):
      # groups:
      #   - picshop_signing        # TEAM_ID
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.picshop.app
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Toolchain
        script: |
          xcodebuild -version
          swift --version
          brew install xcodegen || brew upgrade xcodegen || true
      - name: Generate Xcode project
        script: |
          xcodegen generate
          ls *.xcodeproj
      - name: Package tests (PicshopCore, PicshopIntent, PicshopImaging)
        script: |
          swift build --target PicshopCore --target PicshopIntent --target PicshopImaging
          swift test --filter 'PicshopCoreTests|PicshopIntentTests|PicshopImagingTests'
      - name: Resolve app dependencies
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Build (simulator, unsigned)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || true
          # Fail the step if the build failed (xcpretty masks the exit code).
          xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO -quiet
      - name: Archive (device)
        script: |
          if [ -n "${TEAM_ID:-}" ] && [ -d "$HOME/Library/MobileDevice/Provisioning Profiles" ]; then
            # Signed archive + IPA (profiles are installed by ios_signing).
            xcode-project use-profiles
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          else
            # Unsigned archive so the build is verified end-to-end for the device SDK.
            xcodebuild archive \
              -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
              -destination 'generic/platform=iOS' \
              -configuration Release \
              -archivePath build/PicShop.xcarchive \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
            (cd build && zip -qr PicShop.xcarchive.zip PicShop.xcarchive)
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - build/PicShop.xcarchive.zip
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
      # Uncomment with the App Store Connect integration to ship to TestFlight:
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true
