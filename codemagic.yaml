# Codemagic CI/CD for PicShop.
#
# Workflows
#   picshop-testflight  — Pro build (MLX Pro Brain + Stable Diffusion) signed with your App Store Connect API key, uploaded to TestFlight.
#                          Requirements in Codemagic (Teams → Integrations → Developer Portal):
#                            • an App Store Connect integration named "PetMind ASC API"
#                              (API key with the App Manager role)
#                          Signing uses the distribution certificate uploaded under
#                          Teams → Code signing identities; the App Store provisioning profile for
#                          com.picshopio.picshop is fetched or created automatically with that
#                          certificate. An app record with this bundle ID must exist in
#                          App Store Connect for the TestFlight upload.
#                          Optional: APP_STORE_APPLE_ID (numeric app id) for build-number lookup.
#   picshop-build       — runs on every push: tests + simulator build + unsigned archive,
#                          no Apple credentials needed.
definitions:
  env: &env
    xcode: latest
    vars:
      XCODE_PROJECT: "PicShop.xcodeproj"
      XCODE_SCHEME: "PicShop"
      BUNDLE_ID: "com.picshopio.picshop"
      # Optional: add APP_STORE_APPLE_ID (numeric App Store app id) as a Codemagic environment
      # variable to derive the build number from the latest TestFlight build.
  cache: &cache
    cache_paths:
      - $HOME/Library/Caches/org.swift.swiftpm
      - $HOME/Library/Developer/Xcode/DerivedData
      - $HOME/Library/Caches/picshop-models
  scripts:
    - &toolchain
      name: Toolchain
      script: |
        set -e
        xcodebuild -version
        swift --version
        brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
    - &models
      name: Convert neural models (LaMa, Real-ESRGAN)
      script: |
        if ! ls -d "$HOME/Library/Caches/picshop-models/packages"/*/*.mlpackage >/dev/null 2>&1; then
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "torch==2.5.1" "coremltools==8.2" "numpy<2.3"
        fi
        python3 Scripts/convert_models.py all --out App/Models || true
        ls -la App/Models || true
    - &generate
      name: "Generate Xcode project (Pro — MLX + Stable Diffusion)"
      script: |
        set -e
        xcodegen generate --spec project-pro.yml
        ls -d *.xcodeproj
    - &tests
      name: Package tests
      script: |
        set -e
        # `swift test` builds the whole package test bundle (a per-target build does not produce
        # the .xctest), then runs the platform-independent suites.
        swift test --filter 'PicshopCoreTests|PicshopIntentTests|PicshopImagingTests'
    - &resolve
      name: Resolve dependencies
      script: |
        set -e
        xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
    - &simulator
      name: Build (simulator)
      script: |
        set -e
        xcodebuild build -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
          -destination 'generic/platform=iOS Simulator' -configuration Debug \
          CODE_SIGNING_ALLOWED=NO -quiet

workflows:
  picshop-testflight:
    name: PicShop → TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: PetMind ASC API
    environment:
      <<: *env
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.picshopio.picshop
    cache: *cache
    # Started manually (Start new build → PicShop → TestFlight) once the App Store Connect
    # integration exists; every push is compiled by the "picshop-build" workflow below.
    scripts:
      - *toolchain
      - *models
      - *generate
      - *tests
      - name: Signing files
        script: |
          set -e
          # Certificates and profiles were fetched by Codemagic (ios_signing above); apply them.
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build number
        script: |
          set -e
          LATEST=0
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -n 1 || true)
          fi
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          NEXT=$(( LATEST + 1 ))
          if [ "$NEXT" -lt "${BUILD_NUMBER:-1}" ]; then NEXT="$BUILD_NUMBER"; fi
          echo "Build number: $NEXT"
          agvtool new-version -all "$NEXT"
      - *resolve
      - name: Archive & IPA
        script: |
          set -e
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups:
        #   - Testeurs internes

  picshop-build:
    name: PicShop (build check)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment: *env
    cache: *cache
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - *toolchain
      - *models
      - *generate
      - *tests
      - *resolve
      - *simulator
      - name: Archive (unsigned)
        script: |
          set -e
          xcodebuild archive -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath build/PicShop.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
          (cd build && zip -qr PicShop.xcarchive.zip PicShop.xcarchive)
    artifacts:
      - build/PicShop.xcarchive.zip
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - hakik2.ramadani@gmail.com
        notify:
          success: true
          failure: true
