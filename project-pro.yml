# PicShop "Pro" spec: the standard project (local brain on MLX included) plus the
# Stable Diffusion "Generative Fill" runtime.
#   xcodegen generate --spec project-pro.yml
include:
  - project.yml
packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: "1.1.0"
targets:
  PicShop:
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
